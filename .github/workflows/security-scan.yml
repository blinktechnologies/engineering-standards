name: Reusable Security Scan

# Shared, org-standard security scan. Called directly by this repo's own
# CI (ci.yml) and remotely by other Blink-Tech repos via:
#   uses: blinktechnologies/engineering-standards/.github/workflows/security-scan.yml@main
#
# All actions are pinned to a commit SHA (not a mutable tag) to resist
# supply-chain tampering of an upstream Action.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks (OSS CLI, no license required)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/src --redact --verbose

  dependency-scan:
    name: Dependency vulnerability scan (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OSV-Scanner
        run: |
          set +e
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.0.3 \
            scan --recursive /src
          code=$?
          # 0 = clean, 128 = no scannable manifest/lockfile found (nothing to do).
          # Anything else (1 = vulnerabilities found, etc.) is a real failure.
          if [ "$code" -eq 0 ] || [ "$code" -eq 128 ]; then
            exit 0
          fi
          exit "$code"

  suspicious-files:
    name: Suspicious file scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for suspicious file types
        run: |
          set -e
          matches=$(find . -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.venv/*' \
            -not -path './venv/*' \
            -not -path './__pycache__/*' \
            | grep -Ei '\.(scr|pif|hta|vbs|vbe|wsf|wsh|ps1|bat|cmd|com)$|/autorun\.inf$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Suspicious files found that require manual security review:"
            echo "$matches"
            exit 1
          fi
          echo "No suspicious files found."

  suspicious-patterns:
    name: Suspicious code pattern scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for suspicious code patterns
        run: |
          set -e
          found=0
          files=$(find . -type f \
            \( -name '*.py' -o -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \
               -o -name '*.mjs' -o -name '*.cjs' -o -name '*.sh' -o -name '*.ps1' -o -name '*.bat' \
               -o -name '*.cmd' -o -name '*.php' -o -name '*.rb' -o -name '*.go' -o -name '*.java' \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.venv/*' \
            -not -path './venv/*' \
            -not -path './__pycache__/*')

          check() {
            name="$1"; regex="$2"
            hits=$(printf '%s\n' "$files" | xargs -r grep -nE "$regex" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::warning::Review indicator - $name"
              echo "$hits"
              found=1
            fi
          }

          check "Dynamic code execution"                     '\beval[[:space:]]*\(|\bexec[[:space:]]*\('
          check "Obfuscated PowerShell indicator"             '-[Ee]ncodedCommand\b'
          check "Suspicious download-and-execute indicator"   '[Dd]ownloadString\(|[Dd]ownloadFile\('
          check "Potentially unsafe shell execution"          '\bos\.system[[:space:]]*\(|shell[[:space:]]*=[[:space:]]*True\b'

          if [ "$found" -eq 1 ]; then
            echo "Found potential security review finding(s) above."
            exit 1
          fi
          echo "No configured suspicious patterns found."
