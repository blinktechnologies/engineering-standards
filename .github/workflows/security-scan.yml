
name: Blink-Tech Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suspicious-file-scan:
    name: Suspicious File Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan suspicious files
        run: python security/scripts/scan_suspicious_files.py .

  suspicious-pattern-scan:
    name: Suspicious Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan suspicious source patterns
        run: python security/scripts/scan_suspicious_patterns.py .
